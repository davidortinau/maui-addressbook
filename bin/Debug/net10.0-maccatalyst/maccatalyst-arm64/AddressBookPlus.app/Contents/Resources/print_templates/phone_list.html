<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Address Book - Phone List</title>
    <style>
        @media print {
            @page { 
                margin: 0.5in; 
                size: letter;
            }
            body { 
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: 9pt;
                line-height: 1.1;
                margin: 0;
                padding: 0;
            }
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 9pt;
            line-height: 1.1;
            margin: 20px;
            background: #fff;
        }
        
        .header {
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 16pt;
            color: #333;
        }
        
        .phone-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        .phone-table th {
            background-color: #2c5aa0;
            color: white;
            padding: 8px;
            text-align: left;
            font-weight: bold;
            border: 1px solid #ddd;
        }
        
        .phone-table td {
            padding: 6px 8px;
            border: 1px solid #ddd;
            vertical-align: top;
        }
        
        .phone-table tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        
        .phone-table tbody tr:hover {
            background-color: #e3f2fd;
        }
        
        .name-cell {
            font-weight: 600;
            color: #2c5aa0;
        }
        
        .phone-cell {
            font-family: 'Courier New', monospace;
            color: #333;
        }
        
        .empty-cell {
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Address Book - Phone Directory</h1>
        <p>Generated on {{DATE}}</p>
    </div>
    
    <table class="phone-table">
        <thead>
            <tr>
                <th style="width: 30%">Name</th>
                <th style="width: 23%">Phone 1</th>
                <th style="width: 23%">Phone 2</th>
                <th style="width: 24%">Phone 3</th>
            </tr>
        </thead>
        <tbody>
            {{CONTACTS}}
        </tbody>
    </table>
</body>
</html>
