<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Address Book - Full Binder Format</title>
    <style>
        @media print {
            @page { 
                margin: 0.5in; 
                size: letter;
            }
            body { 
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: 10pt;
                line-height: 1.2;
                margin: 0;
                padding: 0;
            }
            .page-break { 
                page-break-before: always; 
            }
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 10pt;
            line-height: 1.2;
            margin: 20px;
            background: #fff;
        }
        
        .header {
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 18pt;
            color: #333;
        }
        
        .contact-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 12px;
            background: #fafafa;
            break-inside: avoid;
        }
        
        .contact-name {
            font-size: 14pt;
            font-weight: bold;
            color: #2c5aa0;
            margin-bottom: 8px;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }
        
        .contact-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
        }
        
        .info-group {
            margin-bottom: 6px;
        }
        
        .info-label {
            font-weight: 600;
            color: #666;
            font-size: 9pt;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .info-value {
            color: #333;
            margin-left: 8px;
        }
        
        .address-block {
            grid-column: span 2;
            border-left: 3px solid #2c5aa0;
            padding-left: 8px;
            margin-top: 6px;
        }
        
        .notes-block {
            grid-column: span 2;
            margin-top: 8px;
            padding: 8px;
            background: #f0f4ff;
            border-radius: 4px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Address Book - Full Contact Directory</h1>
        <p>Generated on {{DATE}}</p>
    </div>
    
    {{CONTACTS}}
</body>
</html>
